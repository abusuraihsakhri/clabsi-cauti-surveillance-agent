name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Compile source
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -p no:zarr -q

      - name: Console entry-point smoke test
        run: |
          clabsi-cauti-surveillance-agent clabsi --organism "Staphylococcus aureus" --cultures 1 --days 4
          clabsi-cauti-surveillance-agent cauti --organism "Escherichia coli" --cfu 100000 --days 4 --fever
          clabsi-cauti-surveillance-agent metrics --observed 4 --predicted 5.2 --device-days 1200 --patient-days 3500

      - name: Batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          test -s out_smoke.csv
          rm out_smoke.csv

      - name: Validate Pages inputs
        run: |
          test -s index.html
          test -s clabsi_cauti_surveillance.py
          grep -q "Analyze CLABSI" index.html
          grep -q "v314.0.7" index.html
