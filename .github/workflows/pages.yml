name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html clabsi_cauti_surveillance.py LICENSE _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$PAGE_URL" -o /tmp/index.html
          grep -q "CLABSI &amp; CAUTI Surveillance" /tmp/index.html
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "${PAGE_URL}clabsi_cauti_surveillance.py" -o /tmp/surveillance.py
          grep -q "def evaluate_clabsi" /tmp/surveillance.py
          curl --fail --silent --show-error --retry 3 "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js" -o /dev/null
